_target_: context_flux_no.models.multiphysics.HyperFluxFNO
num_spatial_dims: ${..data.num_spatial_dims}
in_channels: ${..data.channels}
in_timesteps: ${..training.context_length}
embedding_dim: 64
encoder_type: ViT
encoder_kwargs:
  patch_size: [4, 4]
  hidden_dim: ${model.embedding_dim}
  num_heads: 8
  num_layers: 2
  dropout: 0.0
  num_hidden_patch: 1
  activation: jax.nn.gelu
  
depth: 4
frequency_modes: 12
lift_dim: 128
stencil_size: [3, 3]
width_lift: ${.lift_dim}
width_project: ${.lift_dim}
width_hyper: ${.lift_dim}
blocks_hyper: 2
blocks_flux: 4
activation:
  _target_: hydra.utils.get_method
  path: jax.nn.gelu
stack_grid: true
hypernet_init: bias_hyperinit
key:
  _target_: jax.random.PRNGKey
  seed: 0