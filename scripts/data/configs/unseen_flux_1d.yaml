# Graded unseen-flux test sets for the 1D cubic checkpoints (ICLR 2027 rebuttal, 1b).
# Read by scripts/data/generate_unseen_flux_1d.py.
defaults:
  - override hydra/launcher: submitit_slurm
  - _self_

hydra:
  launcher:
    timeout_min: 900
    tasks_per_node: 1
    gpus_per_node: 1

# sine_rescaled: f(u) = (a'/|b|) sin(b u), a' ~ U[-amplitude, amplitude], |b| in a bin.
# cubic_shell:   the cubic flux with max|c_i| in a bin outside the training box.
# buckley_leverett: f(u) = 2 a h_M((1 + u) / 2) with the fractional-flow function h_M,
#                scaled to the maximum speed |a'|, a' ~ U[-1, 1], |log10 M| in a bin.
# sine_box:      f(u) = a sin(b u), (a, b) ~ U[-1, 1]^2, the draws of the submitted set.
flux: sine_rescaled

# Index into bins[flux]. Null for sine_box, required for every other flux.
bin_index: null
bins:
  # The bin (0, 1] is last so that the indices of the first three bins keep their meaning.
  # It lies inside the training family and anchors the sweep at the speed of the other bins.
  sine_rescaled: [[1.0, 2.0], [2.0, 3.0], [3.0, 4.0], [0.0, 1.0]]
  cubic_shell: [[1.0, 1.5], [1.5, 2.0], [2.0, 2.5]]
  # Bins of |log10 M|: M or 1/M in (1, 2], (2, 5] and (5, 10], up to rounding of the edges.
  buckley_leverett: [[0.0, 0.3], [0.3, 0.7], [0.7, 1.0]]

# 1.0 is the agreed sweep. 2.0 is the fallback variant of the rebuttal plan.
sine_amplitude_max: 1.0

# grf: periodic Gaussian random field of Section B.2.
# step: shock-dominated family of Section B.2, 1 to 5 jumps. About a fifth are constant states.
# step_min2: the same family with 2 to 5 jumps, which has no constant states.
# The key is not `initial_condition`, which Hydra reads as the config group of that name.
initial_condition_name: step_min2

n_coeffs: 100
n_ics_per_coeff: 100

x_span: [0.0, 1.0]
Nx: 100
t_span: [0.0, 0.5]
# The solver writes Nt + 1 frames and every save_every-th frame is stored, as the
# submitted sets were solved with Nt = 1000 and evaluated on every 10th frame.
Nt: 1000
save_every: 10

# Seed 13 for the new sets. Seed 12 with flux=sine_box repeats the submitted sine draws.
seed: 13

savedir: ./data/datasets/cubic_no_source/data/test
