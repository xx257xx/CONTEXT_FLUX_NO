# Shock-dominated shallow-water test set from the training family (ICLR 2027 rebuttal,
# item 5). Read by scripts/data/generate_shallow_water_step_1d.py.
defaults:
  - override hydra/launcher: submitit_slurm
  - _self_

hydra:
  launcher:
    timeout_min: 900
    tasks_per_node: 1
    gpus_per_node: 1

# Range of the plateau values of h(0), as in Section B.3.
plateau_range: [0.5, 4.5]

# Name of the set in the file name: shallow_water_1d_test_step_{set_name}_grf_seed=...
# "v2" is the corrected set. The submitted set has no such part in its name.
set_name: v2

# m(0): Gaussian random field with a Gaussian covariance, as the second field of
# configs/initial_condition/grf_shallow.yaml, which generated the training set.
momentum_variance: 1.0
momentum_length_scale: 0.3

# Coefficient ranges of the training set as [name, lower, upper], in the order of
# configs/pde/shallow_water_1d.yaml. The order decides which key samples which
# coefficient.
coeff_ranges:
  - [alpha, 0.5, 1.5]
  - [gamma, 0.5, 1.5]
  - [beta, 0.8, 1.2]

# Key derivation of the in-distribution test set: the base key of the test split
# (`BASE_KEY_DICT` in context_flux_no.simulations.utils) and seed 10. The two sets
# then share their 100 coefficient draws.
seed: 10
base_key: 2
n_coeffs: 100
n_ics_per_coeff: 100

# null solves every trajectory. An integer k solves the first k initial conditions of
# the first k coefficient draws, with the keys of the full set, and writes a separate
# file.
pilot_size: null

x_span: [0.0, 1.0]
Nx: 100
t_span: [0.0, 0.5]
Nt: 100

savedir: ./data/datasets/shallow_water_1d/data/test
